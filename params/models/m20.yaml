# DEEP Robotics Lynx M20: loaded after driver_manager_params.yaml when the
# INI's [system] robot_model is m20 (launch/driver_manager.launch.py), and wins
# key by key. The G23's telemetry_* / command_* / scale_* are in g23.yaml,
# which is not loaded on an M20, and the node does not even declare them when
# robot_protocol is m20 (as it declares none of the keys below on a G23).
#
# Bare /** key for the same reason as the factory file (rclrs does not expand
# /**/driver_manager).
/**:
  ros__parameters:
    # Speak the M20's protocol (16-byte header + JSON, manual V0.0.9-0) instead
    # of the G23 gait controller's ASCII. Only stand (motion key "0"), lie down
    # ("2"), cmd_vel and the gait switch (set_policy_mode 0 flat / 1 stairs) are
    # implemented; every other key and service answers an error. Read first: it decides which robot's parameters are declared.
    robot_protocol: "m20"

    # The motion host's UDP protocol server, on the robot's internal LAN.
    motion_host_ip: "10.21.31.103"
    motion_host_port: 30000

    # The axis command is a fraction [-1, 1] of the gait's maximum speed, so
    # these are the cmd_vel values that map to a full-scale command. UNMEASURED:
    # picked above what the basic gait is likely to reach, so a command maps
    # to a smaller fraction than it should, never a larger one. Calibrate them
    # against /odom the way the G23's scale_* were (hold a few plateaus, divide).
    max_vx: 2.0    # m/s
    max_vy: 1.0    # m/s
    # max_wz is also the scale the yaw_map tables below were measured at: their
    # commands are angular.z values sent through THIS divisor. 1.5 with those
    # tables (robot01, 2026-11-27) sent every turn ~1.3x what they meant -- a
    # 0.1 rad/s correction turned the body at ~0.6 -- and a stair landing's
    # in-place turn hunted +-15-22 deg eight times in 9 s. Change it only with
    # tables re-measured at the new value.
    max_wz: 2.0    # rad/s

    # The yaw dead band is NOT compensated here (2026-11-27; the code is kept,
    # m20_protocol.rs YawMap, its tables default to empty = off). The gait
    # does not turn below ~0.5 rad/s and jumps to 0.3-0.5 at 0.6 (open-loop
    # steps, record/m20_stair_1127/t5_turn_response): an inverse table here
    # (c02aa2f) cannot straighten a jump, only move it -- with a threshold at
    # 0.05 and then 0.2 a command just above it turned the body ~1.4x what
    # was asked and just below it nothing, and MPPI weaved +-5 deg on a
    # straight line (t6_weave). The response is in the controller's motion
    # model instead (syncai_controller params/models/m20.yaml yaw_response,
    # syncai_util/yaw_response.hpp), which needs angular.z sent as asked:
    # keep these tables empty while that is set. The first tables, for the
    # record (rate wanted -> angular.z sent, at max_wz 2.0):
    #   left  [0.0, 0.31, 0.53, 0.94] -> [0.55, 0.6, 0.7, 1.0]
    #   right [0.0, 0.5, 0.94] -> [0.55, 0.6, 1.0]

    # cmd_vel is re-sent at 20 Hz (the manual's rate) while younger than this,
    # then the robot is sent zero three times. The backend's teleop publishes at
    # ~10 Hz and the controller at 20 Hz, so 0.3 s rides out two lost messages.
    cmd_timeout: 0.3

    # The vendor's battery (drdds/msg/BatteryData, one entry per pack, 1 Hz),
    # re-published as battery_state — the same sensor_msgs/BatteryState the
    # G23's telemetry gives, the two packs combined into one battery. Absolute
    # for the reason the monitor topics below are.
    battery_topic: "/BATTERY_DATA"

    # The M20's lidar is the vendor stack's, not a Livox driver of ours: both
    # lidars merged into one PointCloud2 on /LIDAR/POINTS_UDP, and its IMU on
    # /IMU, published on DDS domain 0 from the robot's other computers with NO
    # namespace. The names are absolute for that reason (a relative name would
    # resolve to /<robot_id>/LIDAR/POINTS_UDP and the row would read NO DATA
    # forever) — the one place this node names a topic outside /<robot_id>, and
    # only because the publisher is not ours.
    #
    # The lidar row reads Point-LIO's body_cloud, not /LIDAR/POINTS_UDP
    # (2026-11-27): the vendor cloud is ~2.8 MB at 10 Hz (~108 k points), and
    # Fast DDS sends one unicast copy per subscribing process, so this node
    # subscribing it only to count messages doubled what the relay on
    # 10.21.31.106 (ROS 2 Foxy, asynchronous publishing) sends every 0.1 s.
    # robot01 measured the cloud arriving ~78 ms after the relay's stamp with
    # two subscribers, 3.7 ms of it the network -- latency Point-LIO's pose,
    # and so the controller, carries. body_cloud is the same scans after
    # Point-LIO (~1.2 k points), so the row now also goes STALE when Point-LIO
    # stops; a lidar that stops alone is WARNed by Point-LIO itself
    # (lidar_source_timeout). Relative: Point-LIO publishes under /<robot_id>.
    monitor_lidar_topic: "pointlio/body_cloud"
    monitor_lidar_type: "pointcloud2"
    monitor_imu_topic: "/IMU"
