services:
  ros2-rust:
    image: syncai-ros2-rust:${ROS_DISTRO:-humble}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: syncai-ros2-rust
    # Run tini as PID 1 so zombie processes left behind after Ctrl-C get reaped
    init: true
    # Keep the container alive; work in it with `docker compose exec`
    command: sleep infinity
    stdin_open: true
    tty: true
    working_dir: /workspace
    # Use the host network directly: the UDP controller link and DDS go over the physical NIC / lo, not the docker bridge
    network_mode: host
    environment:
      # Change this to isolate from other ROS graphs on the same machine
      ROS_DOMAIN_ID: "2"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    volumes:
      # During development the whole repo is mounted, and build/ install/ log/ are written back to the host (gitignored),
      # so install/ can be taken to another workspace to try out
      - .:/workspace
      - cargo-registry:/home/ros/.cargo/registry
      - cargo-git:/home/ros/.cargo/git

volumes:
  cargo-registry:
  cargo-git:
