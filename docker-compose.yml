services:
  ros2-rust:
    image: syncai-ros2-rust:${ROS_DISTRO:-humble}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: syncai-ros2-rust
    # 用 tini 當 PID 1，才會回收 Ctrl-C 之後留下的 zombie process
    init: true
    # 讓容器一直活著，之後用 `docker compose exec` 進去操作
    command: sleep infinity
    stdin_open: true
    tty: true
    working_dir: /workspace
    # 直接用 host 的網路：UDP 控制器跟 DDS 都走實體網卡 / lo，不經過 docker bridge
    network_mode: host
    environment:
      # 同一台機器上要跟別人的 ROS 網路隔離時，改這個編號
      ROS_DOMAIN_ID: "2"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    volumes:
      # 開發階段：整個 repo 掛進去，build/ install/ log/ 直接寫回 host（已 gitignore），
      # 方便把 install/ 拿去其他 workspace 試跑
      - .:/workspace
      - cargo-registry:/home/ros/.cargo/registry
      - cargo-git:/home/ros/.cargo/git

volumes:
  cargo-registry:
  cargo-git:
