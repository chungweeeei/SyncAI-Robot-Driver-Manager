# Layered on top of ../docker-compose.yml; used only by the Dev Container.
# Relative paths resolve against the first compose file (the repo root).

# A separate compose project: sharing one with `make up` would make the two
# tear down and recreate each other's container whenever either one starts
name: syncai-ros2-rust-devcontainer

services:
  ros2-rust:
    # Use the manually built image:
    #   docker build -f docker/Dockerfile -t syncai-ros2-rust-devcontainer .
    # if it is not present locally, it is built from the settings below and tagged with this name
    image: syncai-ros2-rust-devcontainer:latest
    build:
      args:
        # Always the ros user with uid/gid 1000, regardless of the host's USER_UID variable
        USER_UID: "1000"
        USER_GID: "1000"
        # Also install Claude Code inside the Dev Container
        INSTALL_CLAUDE_CODE: "true"
    user: "1000:1000"
    container_name: syncai-ros2-rust-devcontainer
    volumes:
      # Mount the whole repo at /workspace (same mount point as docker-compose.yml, plus :cached);
      # build/ install/ log/ are written back to the repo directory on the host
      - .:/workspace:cached
      # Claude Code settings and login, so rebuilding the container does not require logging in again
      - claude-config:/home/ros/.claude

# Reuse the cargo cache volumes from `make up`; build output lives in the repo directory, which both already share
volumes:
  cargo-registry:
    name: syncai-ros2-rust_cargo-registry
  cargo-git:
    name: syncai-ros2-rust_cargo-git
  claude-config:
    name: syncai-ros2-rust_claude-config
