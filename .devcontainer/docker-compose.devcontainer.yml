# 疊在 ../docker-compose.yml 上面，只給 Dev Container 用。
# 相對路徑以第一個 compose 檔（repo 根目錄）為基準。

# 獨立的 compose project：跟 `make up` 同一個 project 的話，
# 兩邊輪流啟動時會互相把對方的容器砍掉重建
name: syncai-ros2-rust-devcontainer

services:
  ros2-rust:
    # 用手動 build 的 image：
    #   docker build -f docker/Dockerfile -t syncai-ros2-rust-devcontainer .
    # 本機沒有這張 image 時，會依下面的 build 設定自動 build 並套上這個名稱
    image: syncai-ros2-rust-devcontainer:latest
    build:
      args:
        # 固定用 uid/gid 1000 的 ros 使用者，不受 host 的 USER_UID 環境變數影響
        USER_UID: "1000"
        USER_GID: "1000"
        # Dev Container 裡另外裝 Claude Code
        INSTALL_CLAUDE_CODE: "true"
    user: "1000:1000"
    container_name: syncai-ros2-rust-devcontainer
    volumes:
      # 整個 repo 掛到 /workspace，編輯器才看得到 README、Makefile 等檔案。
      # build/ install/ log/ 仍然被 named volume 蓋掉，不會寫回 host。
      - .:/workspace:cached
      # Claude Code 的設定與登入資訊，容器重建後不用重新登入
      - claude-config:/home/ros/.claude

# 沿用 `make up` 那組 volume，編譯產物與 cargo cache 兩邊共用
volumes:
  colcon-build:
    name: syncai-ros2-rust_colcon-build
  colcon-install:
    name: syncai-ros2-rust_colcon-install
  colcon-log:
    name: syncai-ros2-rust_colcon-log
  cargo-registry:
    name: syncai-ros2-rust_cargo-registry
  cargo-git:
    name: syncai-ros2-rust_cargo-git
  claude-config:
    name: syncai-ros2-rust_claude-config
